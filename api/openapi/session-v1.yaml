openapi: 3.1.0
info:
  title: ANI Realtime Session Gateway Internal API
  version: 0.1.0
  description: Contract projection of the internal gRPC CreateSession interface.
paths:
  /ani.session.v1.SessionService/GetSessionReplay:
    post:
      operationId: getSessionReplay
      summary: Read an existing VM console intent without issuing a new ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSessionReplayRequest'
      responses:
        '200':
          description: Original session and ticket while still claimable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '403': {description: Requires the verified Governance mTLS identity.}
        '404': {description: No prior session for this tenant and subject.}
        '409': {description: VM or original version differs from the stored intent.}
        '422': {description: Original ticket was claimed, closed or expired.}
        '503': {description: Session store unavailable.}
  /ani.session.v1.SessionService/CreateSession:
    post:
      operationId: createSession
      summary: Issue or replay a one-time realtime session ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session issued or replayed while still claimable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '409': {description: Idempotency key conflicts with another fingerprint.}
        '422': {description: Session is no longer claimable.}
        '429': {description: Capacity exhausted.}
        '503': {description: Store or runtime dependency unavailable.}
components:
  schemas:
    Principal:
      type: object
      required: [tenantId, subjectId]
      properties:
        tenantId: {type: string}
        subjectId: {type: string}
    Target:
      type: object
      required: [instanceId, workloadName, workloadKind]
      properties:
        instanceId: {type: string}
        workloadName: {type: string}
        vmBinding: {$ref: '#/components/schemas/VMConsoleBinding'}
        workloadKind:
          type: string
          enum: [WORKLOAD_KIND_CONTAINER, WORKLOAD_KIND_GPU_CONTAINER, WORKLOAD_KIND_SANDBOX, WORKLOAD_KIND_VM]
    VMConsoleBinding:
      type: object
      description: Resource-owned immutable identity, restricted to VM VNC and the exact Governance mTLS caller.
      required: [tenantId, vmId, version, clusterId, namespace, vmName, vmUid, vmiName, vmiUid, namespaceUid]
      properties:
        tenantId: {type: string}
        vmId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        clusterId: {type: string}
        namespace: {type: string}
        vmName: {type: string}
        vmUid: {type: string}
        vmiName: {type: string}
        vmiUid: {type: string}
        namespaceUid: {type: string}
    GetSessionReplayRequest:
      type: object
      required: [idempotencyKey, principal, instanceId, expectedVersion]
      properties:
        idempotencyKey: {type: string}
        principal: {$ref: '#/components/schemas/Principal'}
        instanceId: {type: string}
        expectedVersion: {type: integer, format: int64, minimum: 1}
    ExecOptions:
      type: object
      properties:
        container: {type: string}
        command: {type: array, items: {type: string}}
        tty: {type: boolean}
        rows: {type: integer, format: int32}
        cols: {type: integer, format: int32}
    VMConsoleOptions:
      type: object
      required: [protocol]
      properties:
        protocol: {type: string, enum: [PROTOCOL_SERIAL, PROTOCOL_VNC]}
        requestedProtocol: {type: string}
    CreateSessionRequest:
      type: object
      required: [principal, target]
      properties:
        requestId: {type: string}
        idempotencyKey: {type: string}
        principal: {$ref: '#/components/schemas/Principal'}
        target: {$ref: '#/components/schemas/Target'}
        exec: {$ref: '#/components/schemas/ExecOptions'}
        vmConsole: {$ref: '#/components/schemas/VMConsoleOptions'}
      oneOf:
        - required: [exec]
        - required: [vmConsole]
    CreateSessionResponse:
      type: object
      required: [sessionId, connectUrl, expiresAt, replayed]
      properties:
        sessionId: {type: string}
        connectUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
        replayed: {type: boolean}

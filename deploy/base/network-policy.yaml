apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ani-session-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ani-session-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ani-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ani-gateway
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ani-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubevirt
          podSelector:
            matchLabels:
              kubevirt.io: virt-api
      ports:
        - protocol: TCP
          port: 8443


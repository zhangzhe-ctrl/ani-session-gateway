apiVersion: v1
kind: ConfigMap
metadata:
  name: ani-session-gateway
data:
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  PUBLIC_WS_BASE_URL: "ws://session-gateway.example.invalid:30081/api/v1/realtime"
  ALLOWED_ORIGINS: "http://console.example.invalid"
  STORE_MODE: redis
  TICKET_TTL: 60s
  SESSION_MAX_DURATION: 15m
  IDEMPOTENCY_TTL: 15m
  MAX_ACTIVE_SESSIONS: "100"
  MAX_ACTIVE_PER_SUBJECT: "5"
  WS_MAX_MESSAGE_BYTES: "65536"
  WS_HANDSHAKE_TIMEOUT: 10s
  WS_IDLE_TIMEOUT: 10m
  SHUTDOWN_GRACE_PERIOD: 25s
  OTEL_SERVICE_NAME: ani-session-gateway


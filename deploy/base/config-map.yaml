apiVersion: v1
kind: ConfigMap
metadata:
  name: ani-session-gateway
  annotations:
    ani.kubercloud.io/localhost-origin-purpose: frontend-local-development-only
data:
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  PUBLIC_WS_BASE_URL: "ws://10.10.1.66:30082/api/v1/realtime"
  # localhost:5173 is allowed only for local frontend development.
  ALLOWED_ORIGINS: "http://10.10.1.66:30081,http://localhost:5173"
  STORE_MODE: redis
  TICKET_TTL: 60s
  SESSION_MAX_DURATION: 15m
  IDEMPOTENCY_TTL: 15m
  MAX_ACTIVE_SESSIONS: "100"
  MAX_ACTIVE_PER_SUBJECT: "5"
  WS_MAX_MESSAGE_BYTES: "65536"
  WS_HANDSHAKE_TIMEOUT: 10s
  WS_IDLE_TIMEOUT: 10m
  SHUTDOWN_GRACE_PERIOD: 25s
  OTEL_SERVICE_NAME: ani-session-gateway

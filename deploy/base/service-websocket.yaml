apiVersion: v1
kind: Service
metadata:
  name: ani-session-gateway-websocket
  labels:
    app.kubernetes.io/name: ani-session-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ani-session-gateway
  ports:
    - name: websocket
      port: 8080
      targetPort: http
      nodePort: 30081
      protocol: TCP

